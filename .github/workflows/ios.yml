name: Build iOS IPA

# 云编译未签名 IPA，用于 Sideloadly / AltStore 侧载安装（无需付费开发者账号）
# 触发方式：Actions 页面手动 "Run workflow"，或推送 main 且改动相关路径时自动运行

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "pwa/**"
      - "tools/offline/**"
      - "book/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/ios.yml"

jobs:
  build-ios:
    name: Build unsigned IPA (sideload-ready)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build offline single-file web app
        run: node tools/offline/build.mjs pwa/index.html

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Build unsigned .app (iphoneos / arm64)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr HowToLiveBetter-unsigned.ipa Payload
          shasum -a 256 HowToLiveBetter-unsigned.ipa
          ls -lh HowToLiveBetter-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HowToLiveBetter-unsigned-ipa
          path: HowToLiveBetter-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
